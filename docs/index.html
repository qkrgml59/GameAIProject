  function renderHud() {
    const W = G.WEATHER[S.weather];
    const alive = G.aliveCount(S);
    const phaseIdx = S.ended ? 4 : S.phase === 'morning' ? 0 : 2;
    const steps = ['① 계획', '② 결과', '③ 밤 대비', '④ 다음 날'].map((t, i) =>
      `<span class="step ${i < phaseIdx ? 'done' : i === phaseIdx ? 'now' : ''}">${i < phaseIdx ? '✓ ' : ''}${t}</span>`).join('<span class="step-arrow">›</span>');
    const foodLow = S.food < alive;
    const bar = (v, col) => `<span class="bar"><i style="width:${v}%;background:${col}"></i></span>`;
    return `<header class="hud">
      <div class="day-badge">${S.day}일차<small>${{ morning: '아침 · 행동 선택', evening: '저녁 · 밤 대비', ended: '종료' }[S.phase]}</small></div>
      <nav class="steps" aria-label="오늘의 진행 단계">${steps}</nav>
      <div class="res">
        <span class="chip ${foodLow ? 'warn' : ''}" title="식량: 밤마다 생존자 1명당 1개">🍞 <b>${S.food}</b><span class="muted small">/ 필요 ${alive}</span></span>
        <span class="chip ${S.morale < 30 ? 'warn' : ''}" title="사기: 낮으면 행동 효율이 떨어짐">💛 <b>${S.morale}</b>${bar(S.morale, S.morale < 30 ? 'var(--danger)' : 'var(--morale)')}</span>
        <span class="chip ${S.threat >= 60 ? 'warn' : ''}" title="위협도: 높을수록 밤 습격 확률↑">☣️ <b>${S.threat}</b>${bar(S.threat, S.threat >= 60 ? 'var(--danger)' : 'var(--threat)')}</span>
        <span class="chip" title="방어력">🛡️ <b>${S.defense}</b></span>
        <span class="chip mini" title="재료 · 의약품 · UV 배터리 · 소음기">🧰${S.materials} 💊${S.medicine} 🔦${S.uvBattery} 📢${S.noisemakers}</span>
        <span class="chip mini" title="구조 신호 (6회면 승리)">📡 ${S.rescueSignals}/6</span>
        <span class="chip" title="날씨 · 햇빛">${W.icon} ${W.name}</span>
      </div>
      <div class="hud-menu">
        <button class="btn ghost" data-a="help" aria-label="게임 설명">❔ 설명</button>
        <button class="btn ghost" data-a="menu">메인</button>
        <button class="btn ghost danger" data-a="reset">처음부터</button>
      </div>
    </header>`;
  }

  function renderCard(p) {
    const c = G.CHAR[p.id];
    const asg = S.assignments.find((a) => a.sid === p.id);
    const tags = [];
    if (p.status === 'dead') tags.push('<span class="tag bad">사망</span>');
    else if (p.status === 'dying') tags.push(`<span class="tag bad">빈사 ${3 - p.dyingDays}일</span>`);
    else if (p.hp < p.maxHp * 0.4) tags.push('<span class="tag bad">중상</span>');
    else if (p.hp < p.maxHp * 0.75) tags.push('<span class="tag">부상</span>');
    if (p.id === 'gayoon' && p.status === 'ok') { const g = G.gayoonState(S); tags.push(`<span class="tag ${g === '안정' ? 'ok' : g === '충격' ? 'bad' : ''}">${g}</span>`); }
    if (p.id === 'dongkeun' && p.status !== 'dead') tags.push(`<span class="tag">신뢰 ${G.trustLabel(S)}</span>`);
    if (p.id === 'hyerin' && p.status === 'ok' && G.isCrisis(S)) tags.push('<span class="tag ok">본능 +1칸</span>');
    if (p.id === 'pyeongoh' && p.status === 'ok' && S.threat >= 70) tags.push('<span class="tag bad">당황</span>');
    if (p.id === 'juyeon' && S.juyeonIdea && p.status === 'ok') tags.push('<span class="tag ok">아이디어!</span>');
    const pct = Math.round((p.hp / p.maxHp) * 100);
    const barCls = pct < 30 ? 'crit' : pct < 60 ? 'low' : '';
    const cls = ['card', ui.sel === p.id ? 'sel' : '', p.status === 'dying' ? 'dying' : '', p.status === 'dead' ? 'dead' : '', asg ? 'busy' : ''].join(' ');
    return `<button class="${cls}" style="--c:${c.color}" data-a="select" data-v="${p.id}" ${p.status === 'dead' ? 'disabled' : ''} aria-pressed="${ui.sel === p.id}">
      ${asg ? `<span class="task">${ACT_ICON[asg.action]} ${G.ACTIONS[asg.action].name}</span>` : ''}
      ${pf(p.id, cardExpr(p))}
      <span><span class="cname">${c.name}</span><br><span class="crole">${c.role}</span></span>
      <span class="hp" title="체력 ${p.hp}/${p.maxHp}"><span>❤️</span><span class="hpbar"><i class="${barCls}" style="width:${pct}%"></i></span><span>${p.hp}</span></span>
      <span class="tags">${tags.join('')}</span>
    </button>`;
  }

  /* ---------- 가운데: 계획 패널 ---------- */
  function renderPlan() {
    if (S.ended) return `<div class="col-title"><h2>${esc(S.ended.title)}</h2></div><p class="muted">${esc(S.ended.text)}</p>`;
    if (S.phase === 'evening') return renderEvening();
    const step = !ui.sel ? 0 : !ui.action ? 1 : 2;
    const howto = ['① 생존자 고르기', '② 행동 고르기', '③ 배정하기'].map((t, i) => `<span class="${i === step ? 'on' : ''}">${t}</span>`).join('');
    let body;
    if (!ui.sel) body = renderOverview();
    else body = renderChooser();
    return `<div class="col-title"><h2>오늘의 계획</h2><span class="muted small">행동 칸 ${G.maxAP(S) - S.assignments.length}/${G.maxAP(S)} 남음</span></div>
      <div class="howto">${howto}</div>${body}`;
  }

  function renderOverview() {
    const items = [];
    const alive = G.aliveCount(S);
    const dying = S.survivors.filter((p) => p.status === 'dying');
    if (dying.length) items.push(['bad', '🚑', `${dying.map((p) => `<b>${G.nm(p.id)}</b>(${3 - p.dyingDays}일 남음)`).join(', ')} 빈사 — 다른 생존자에게 <b>🩹 치료</b>를 맡기세요.`]);
    if (S.food < alive) items.push(['bad', '🍞', `식량이 오늘 밤 필요량(${alive})보다 적어요. <b>🎒 급식실 탐색</b>(용찬이면 +2)이나 저녁의 <b>배급 절약</b>.`]);
    if (S.threat >= 60) items.push(['bad', '☣️', `위협도 ${S.threat}. <b>📢 소음 유인</b>으로 좀비를 떼어내거나 <b>🛡️ 방어 준비</b>를 하세요.`]);
    if (S.morale < 30) items.push(['bad', '💛', `사기가 낮아 모두의 효율이 떨어졌어요. <b>😴 휴식</b>이나 <b>💬 대화</b>로 회복.`]);
    for (const a of G.advice(S)) {
      const id = G.CHARACTERS.find((c) => c.name === a.who);
      items.push(['', id ? pf(id.id, 'default', 'sm') : '💡', `<b>${a.who}</b> ${esc(a.text)}`]);
    }
    const uniq = items.slice(0, 5);
    return `<p style="margin:0 0 10px"><b>생존자 카드</b>를 누르면 할 일을 정할 수 있어요.</p>
      <div class="notice">${uniq.map(([cls, ico, txt]) => `<div class="notice-item ${cls}"><span class="ico">${ico}</span><span>${txt}</span></div>`).join('')}</div>`;
  }

  function renderChooser() {
    const p = G.sv(S, ui.sel), c = G.CHAR[ui.sel];
    const head = `<div class="who-head" title="${esc(c.trait + ': ' + c.traitDesc)}">${fb(p.id, cardExpr(p))}<div>
        <div class="nm" style="color:${c.color}">${c.name} <span class="muted small" style="font-family:var(--body)">${c.role}</span></div>
        <div class="trait"><b>${c.trait}</b> · ${c.traitDesc}</div>
        <div class="small" style="margin-top:6px">❤️ ${p.hp}/${p.maxHp}${p.id === 'gayoon' ? ` · 정신 ${G.gayoonState(S)} ${S.gayoonMental}` : ''}${p.id === 'dongkeun' ? ` · 신뢰 ${G.trustLabel(S)}` : ''}</div>
      </div></div>`;
    if (p.status === 'dying') return head + `<div class="notice-item bad"><span class="ico">🚑</span><span>${c.name}${particle(c.name, '은/는')} 빈사 상태라 움직일 수 없어요. 다른 생존자를 골라 <b>🩹 치료</b>를 맡기세요.</span></div>`;
    const asg = S.assignments.findIndex((a) => a.sid === ui.sel);
    if (asg >= 0) return head + `<div class="notice-item"><span class="ico">${ACT_ICON[S.assignments[asg].action]}</span><span>오늘 할 일: <b>${esc(G.describeAssignment(S.assignments[asg]))}</b></span></div>
      <button class="btn" style="margin-top:10px" data-a="unassign" data-v="${asg}">배정 취소하고 다시 고르기</button>`;
    const acts = Object.entries(G.ACTIONS).map(([k, A]) => {
      const why = actionBlock(ui.sel, k);
      return `<button class="act ${ui.action === k ? 'on' : ''}" data-a="pick-action" data-v="${k}" ${why ? `disabled title="${why}"` : ''}>
        <span class="ai">${ACT_ICON[k]}</span><span class="an">${A.name}</span><span class="ad">${why || A.desc}</span></button>`;
    }).join('');
    return `<div class="${ui.action ? 'compact' : ''}">` + head + `<div class="sec">무엇을 시킬까요?</div><div class="acts">${acts}</div>${ui.action ? renderOptions() + renderPreview() : ''}</div>`;
  }

  function renderOptions() {
    const others = S.survivors.filter((x) => x.id !== ui.sel && x.status !== 'dead');
    switch (ui.action) {
      case 'explore': {
        const rooms = Object.entries(G.LOCATIONS).filter(([, L]) => L.explorable).map(([k, L]) => {
          const d = G.exploreDanger(S, ui.sel, k, ui.mode);
          return `<button class="room ${ui.loc === k ? 'on' : ''}" data-a="pick-loc" data-v="${k}">
            <span class="ri">${LOC_ICON[k]}</span><span class="rn">${L.name}</span><span class="rd">${LOC_GIVES[k]}</span>
            <span class="rk ${riskClass(d)}">위험 ${G.riskLabel(d)}</span></button>`;
        }).join('');
        return `<div class="sec">어디로 갈까요?</div><div class="schoolmap opts">${rooms}</div>`;
      }
      case 'treat': {
        const hurt = others.filter((x) => x.status === 'dying' || x.hp < x.maxHp);
        return `<div class="sec">누구를 치료할까요?</div><div class="opts">${hurt.map((x) => `<button class="opt ${ui.target === x.id ? 'on' : ''}" data-a="pick-target" data-v="${x.id}">${G.nm(x.id)} ${x.status === 'dying' ? '🚑 빈사' : `❤️ ${x.hp}/${x.maxHp}`}</button>`).join('')}</div>`;
      }
      case 'talk':
        return `<div class="sec">누구와 이야기할까요?</div><div class="opts">${others.filter((x) => x.status === 'ok').map((x) => `<button class="opt ${ui.target === x.id ? 'on' : ''}" data-a="pick-target" data-v="${x.id}">${G.nm(x.id)}${x.id === 'gayoon' ? ` (${G.gayoonState(S)})` : x.id === 'dongkeun' ? ` (신뢰 ${G.trustLabel(S)})` : ''}</button>`).join('')}</div>`;
      case 'craft':
        return `<div class="sec">무엇을 만들까요? <span class="muted">(남은 재료 🧰${G.available(S, 'materials')})</span></div><div class="opts">${Object.entries(G.RECIPES).map(([k, R]) => `<button class="opt ${ui.recipe === k ? 'on' : ''}" data-a="pick-recipe" data-v="${k}" ${G.available(S, 'materials') < R.cost ? 'disabled' : ''}>${R.name} · 🧰${R.cost}</button>`).join('')}</div>`;
      case 'fortify':
        return `<div class="sec">재료를 쓸까요?</div><div class="opts">
          <button class="opt ${!ui.useMaterial ? 'on' : ''}" data-a="pick-mat" data-v="0">그냥 보강</button>
          <button class="opt ${ui.useMaterial ? 'on' : ''}" data-a="pick-mat" data-v="1" ${G.available(S, 'materials') < 1 ? 'disabled' : ''}>재료 1개로 더 튼튼하게 (방어 +6)</button></div>`;
      case 'lure':
        return `<div class="sec">어떻게 유인할까요?</div><div class="opts">
          <button class="opt ${ui.lureMode === 'manual' ? 'on' : ''}" data-a="pick-lure" data-v="manual">직접 뛰기 · 부상 위험</button>
          <button class="opt ${ui.lureMode === 'device' ? 'on' : ''}" data-a="pick-lure" data-v="device" ${G.available(S, 'noisemakers') < 1 ? 'disabled' : ''}>📢 소음기 · 안전 (보유 ${G.available(S, 'noisemakers')})</button></div>`;
    }
    return '';
  }

  function renderPreview() {
    const plan = currentPlan();
    const err = G.validate(S, plan);
    const rows = [];
    const sid = plan.sid;
    const eff = G.efficiency(S, sid);
    let risk = null;
    if (plan.action === 'explore' && plan.loc) {
      const d = G.exploreDanger(S, sid, plan.loc, plan.mode);
      const r = G.riskReport(S, d);
      risk = d;
      rows.push(['위험도', `<span class="${riskClass(d)}"><b>${r.label}</b>${r.range ? ` (${r.range[0]}~${r.range[1]}%)` : ''}</span>`]);
      const L = G.LOCATIONS[plan.loc];
      if (G.able(S, 'pyeongoh')) {
        const lr = G.lootRange(S, sid, plan.loc, plan.mode);
        rows.push(['예상 수확', lr ? `${G.LOOT_NAME[lr.res]} ${lr.min}~${lr.max}개` : L.loot === 'intel' ? '이틀간 탐색 위험 −10' : S.weather === 'fog' ? '안개: 신호 불가, 위협도 −4' : '구조 신호 +1']);
      } else rows.push(['예상 수확', '평오가 없어 알 수 없음']);
      rows.push(['소음', `${G.MODES[plan.mode].noise}${sid === 'yongchan' ? ' (+용찬 돌발 가능)' : ''}${sid === 'jeongmin' ? ' (+정민 돌발 가능)' : ''}`]);
      rows.push(['', `<span class="muted small">${esc(r.note)}. 실패해도 일부 자원을 챙긴다.</span>`]);
    } else if (plan.action === 'rest') {
      rows.push(['효과', `체력 +20, 사기 +1${sid === 'gayoon' ? ', 가윤 안정도 +12' : ''}`], ['소음', '0']);
    } else if (plan.action === 'treat') {
      rows.push(['효과', G.available(S, 'medicine') > 0 ? '💊 1개 사용: 체력 +45 (빈사면 40으로 소생)' : '의약품 없음: 붕대 +15 (빈사면 15로 소생)'], ['소음', '0']);
    } else if (plan.action === 'fortify') {
      rows.push(['효과', `방어 +${G.fortifyValue(S, sid, plan.useMaterial)}`], ['소음', '4 (망치질)']);
    } else if (plan.action === 'craft' && plan.recipe) {
      const R = G.RECIPES[plan.recipe];
      rows.push(['효과', R.desc], ['성공률', sid === 'juyeon' ? (S.juyeonIdea ? '대성공 확정' : '약 76% (대성공 12%)') : '55%'], ['실패 시', '재료 1개만 손실'], ['소음', '2']);
    } else if (plan.action === 'defend') {
      rows.push(['효과', `오늘 밤 방어 준비 +${G.defendValue(S, sid)}${sid === 'minseong' ? ', 습격 시 위협도 추가 −10' : ''}${sid === 'dongkeun' ? ', 동료 대신 맞을 확률↑' : ''}`], ['소음', '1']);
    } else if (plan.action === 'talk' && plan.target) {
      rows.push(['효과', plan.target === 'gayoon' ? `가윤 안정도 +${sid === 'hyerin' ? 30 : sid === 'minseong' ? '5 또는 25' : 20}` : plan.target === 'dongkeun' ? '동근 신뢰도 +10' : '사기 +3'], ['소음', '0']);
    } else if (plan.action === 'lure') {
      const v = (plan.lureMode === 'device' ? 20 : 12) + (sid === 'jeongmin' ? 5 : 0);
      rows.push(['효과', `위협도 −${v}`]);
      if (plan.lureMode === 'manual') { const d = G.lureDanger(S, sid); risk = d; rows.push(['부상 위험', `<span class="${riskClass(d)}"><b>${G.riskLabel(d)}</b>${G.able(S, 'pyeongoh') ? ` (약 ${d}%)` : ''}</span>`]); }
    }
    if (eff !== 1 && ['explore', 'fortify', 'defend'].includes(plan.action)) rows.push(['효율', `×${eff.toFixed(2)}${sid === 'gayoon' ? ` (가윤 ${G.gayoonState(S)})` : ''}${S.morale < 25 ? ' (낮은 사기)' : ''}`]);
    const name = G.nm(sid);
    const modes = plan.action === 'explore' ? `<div class="opts mode-row"><span class="muted small">이동 방식</span>${Object.entries(G.MODES).map(([k, M]) => `<button class="opt ${ui.mode === k ? 'on' : ''}" data-a="pick-mode" data-v="${k}" title="${M.desc}">${M.name} <span class="muted small">${M.desc}</span></button>`).join('')}</div>` : '';
    return `<div class="plan-foot">${modes}<div class="preview">
        ${risk != null ? `<div class="riskbar" aria-hidden="true"><i style="width:${risk}%;background:${riskColor(risk)}"></i></div>` : ''}
        ${rows.map(([k, v]) => `<div class="row ${k ? '' : 'full'}"><span>${k}</span><span>${v}</span></div>`).join('')}
        ${err ? `<div class="err">${esc(err)}</div>` : ''}
      </div>
      <button class="btn primary assign-btn" data-a="assign" ${err ? 'disabled' : ''}>${ACT_ICON[plan.action]} ${name}에게 배정하기</button></div>`;
  }

  function renderSummary() {
    let out = '';
    if (S.spotlight && G.CHAR[S.spotlight.id]) {
      const sp = S.spotlight, c = G.CHAR[sp.id];
      out += `<div class="spot">${pf(sp.id, sp.expr, 'lg')}<div class="bubble"><b style="color:${c.color}">${c.name} <span class="muted small">· 오늘의 장면</span></b><p>${esc(sp.text)}</p></div></div>`;
    }
    if (S.summary) {
      out += `<div class="small muted">${esc(S.summary.title)}</div>`;
      out += S.summary.deltas.length ? `<div class="delta">${S.summary.deltas.map((d) => {
        const good = d.v > 0 ? d.key !== 'threat' : d.key === 'threat';
        return `<span class="${good ? 'up' : 'down'}">${d.label} ${d.v > 0 ? '+' : ''}${d.v}</span>`;
      }).join('')}</div>` : '<div class="delta"><span>큰 변화 없음</span></div>';
    }
    return out;
  }

  function renderEvening() {
    const alive = G.aliveCount(S);
    const need = S.night.ration ? Math.ceil(alive / 2) : alive;
    const pt = G.projectedThreat(S), rc = G.raidChance(S);
    const extra = G.able(S, 'yongchan') && !S.night.ration ? 1 : 0;
    return `<div class="col-title"><h2>낮 결과 · 밤 대비</h2></div>
      ${renderSummary()}
      <div class="sec">오늘 밤 습격 확률</div>
      <div class="raid"><span class="pct ${riskClass(rc)}">${rc}%</span><span class="meta">
        <span>☣️ 위협도 ${S.threat} → <b>${pt}</b> (오늘 소음 ${S.noiseToday}${S.weather === 'rain' ? ', 빗소리로 60%만 반영' : ''})</span>
        <span>🛡️ 방어력 ${S.defense} · 방어 준비 ${S.prep}</span>
        <span style="${S.food < need + extra ? 'color:var(--danger)' : ''}">🍞 밤에 먹을 식량 ${need}${extra ? ' + 용찬 1' : ''}개 (보유 ${S.food})</span>
      </span></div>
      <div class="sec">대비할 것을 고르세요 (선택)</div>
      <div class="toggles">
        <label class="toggle"><span class="tt"><input type="checkbox" data-a="night" data-v="uv" ${S.night.uv ? 'checked' : ''} ${S.uvBattery <= 0 ? 'disabled' : ''}>🔦 UV 랜턴</span><span class="muted">습격 −25%, 피해↓ · 배터리 1 (남음 ${S.uvBattery})${S.uvBattery <= 0 ? ' — 과학실 재료로 제작' : ''}</span></label>
        <label class="toggle"><span class="tt"><input type="checkbox" data-a="night" data-v="hush" ${S.night.hush ? 'checked' : ''}>🤫 숨죽이기</span><span class="muted">소음 영향 절반 · 사기 −3</span></label>
        <label class="toggle"><span class="tt"><input type="checkbox" data-a="night" data-v="ration" ${S.night.ration ? 'checked' : ''}>🍞 배급 절약</span><span class="muted">식량 절반만 · 사기 −4, 체력 −3</span></label>
      </div>`;
  }

  /* ---------- 오른쪽: 기록 ---------- */
  function renderLog() {
    const from = ui.logAll ? 0 : S.day - 1;
    const entries = S.log.filter((e) => e.day >= from).slice(-150);
    let html = '', lastDay = null;
    for (const e of entries) {
      if (e.day !== lastDay) { html += `<div class="day-sep">${e.day}일차</div>`; lastDay = e.day; }
      const who = findChar(e.text);
      html += `<div class="le ${e.tone} ${e.phase === '사건' ? 'event' : ''}">${who ? pf(who, logExpr(e), 'xs') : '<span class="dot">•</span>'}<span><span class="ph">${e.phase}</span>${esc(e.text)}</span></div>`;
    }
    const hasOld = S.log.some((e) => e.day < S.day - 1);
    return `<div class="col-title"><h2>사건 기록</h2>${hasOld ? `<button class="linkbtn" data-a="log-all">${ui.logAll ? '최근만 보기' : '전체 보기'}</button>` : ''}</div>
      <div class="log" aria-live="polite">${html}</div>`;
  }

  /* ---------- 아래: 명령 바 ---------- */
  function renderCmd() {
    const max = G.maxAP(S);
    let slots = '';
    if (S.phase === 'morning' && !S.ended) {
      for (let i = 0; i < max; i++) {
        const a = S.assignments[i];
        slots += a
          ? `<button class="slot assign" data-a="unassign" data-v="${i}" title="${esc(G.describeAssignment(a))} (눌러서 취소)" aria-label="${esc(G.describeAssignment(a))} 취소">${pf(a.sid)}<span class="si">${ACT_ICON[a.action]}</span><span class="sx">×</span></button>`
          : `<span class="slot ${i >= 3 ? 'bonus' : ''}" title="${i >= 3 ? '혜린의 생존 본능 보너스 칸' : '빈 행동 칸'}">${i >= 3 ? '+1' : '빈 칸'}</span>`;
      }
    }
    let hint = '', btn = '';
    if (S.ended) {
      hint = `<b>${esc(S.ended.title)}</b>`;
      btn = '<button class="btn primary cta" data-a="new">새 게임 시작</button>';
    } else if (S.phase === 'morning') {
      const left = max - S.assignments.length;
      if (left === 0) hint = '행동 칸이 다 찼어요. <b>낮 행동 실행</b>을 누르세요.';
      else if (!ui.sel) hint = `<b>생존자 카드</b>를 눌러 할 일을 정하세요. (빈 칸 ${left}개)`;
      else if (!ui.action) hint = `<b>${G.nm(ui.sel)}</b>에게 시킬 행동을 고르세요.`;
      else { const err = G.validate(S, currentPlan()); hint = err ? esc(err) : '가운데의 <b>배정하기</b>를 누르면 아래 칸에 들어가요.'; }
      const choosing = ui.sel && ui.action && left > 0;   // 행동을 고르는 중엔 ‘배정하기’가 주인공
      btn = `<button class="btn ${choosing ? '' : 'primary'} cta" data-a="run-day">☀️ 낮 행동 실행</button>`;
    } else {
      hint = `습격 확률 <b>${G.raidChance(S)}%</b>. 대비를 정하고 <b>밤 보내기</b>를 누르세요.`;
      btn = `<button class="btn primary cta" data-a="run-night">🌙 밤 보내기</button>`;
    }
    return `<footer class="cmd">${slots ? `<div class="slots" aria-label="오늘의 행동 칸">${slots}</div>` : ''}<div class="hint">${hint}</div>${btn}</footer>`;
  }

  function renderEnd() {
    const v = S.ended.type === 'victory';
    const alive = G.aliveCount(S);
    return `<div class="overlay"><div class="modal" role="dialog" aria-label="${esc(S.ended.title)}">
      <p class="muted">${v ? '임시 승리' : '게임 오버'}</p>
      <h2>${esc(S.ended.title)}</h2>
      <p>${esc(S.ended.text)}</p>
      <div class="end-cast">${S.survivors.map((p) => pf(p.id, p.status === 'dead' ? 'default' : v ? 'smile' : 'tired', 'sm', p.status === 'dead' ? 'dead' : '')).join('')}</div>
      <ul>
        <li>버틴 날: ${S.day - 1}일</li>
        <li>생존자: ${alive}명 (${S.survivors.filter((p) => p.status !== 'dead').map((p) => G.nm(p.id)).join(', ') || '없음'})</li>
        <li>탐색 ${S.stats.explores}회 · 습격 ${S.stats.raids}회 (막아냄 ${S.stats.repelled}) · 제작 ${S.stats.crafted}회</li>
      </ul>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-a="new">새 게임 시작</button><button class="btn" data-a="view-log">기록 보기</button></div>
    </div></div>`;
  }

  function render() {
    CharacterArt.install();
    if (ui.screen === 'menu' || !S) renderMenu(); else renderGame();
    if (ui.intro) { app.insertAdjacentHTML('beforeend', renderIntro()); positionTour(); }
    renderToast();
  }

  /* ---------- 입력 처리 ---------- */
  function resetSelection() { ui.sel = null; ui.action = null; ui.target = null; ui.useMaterial = false; }
  function startNew() {
    S = Game.newGame(); ui.screen = 'game'; ui.modal = null; resetSelection(); save();
    if (!tutDone()) { ui.intro = { type: 'chars', idx: 0, from: 'first' }; render(); return; }
    render(); toast('새 게임 시작! 생존자 카드를 눌러 보세요.');
  }

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-a]');
    if (!el) return;
    if (el.dataset.a === 'close-modal' && el.classList.contains('overlay') && ev.target.closest('[data-stop]')) return;
    const a = el.dataset.a, v = el.dataset.v;
    if (el.tagName === 'INPUT') return;
    switch (a) {
      case 'new': startNew(); return;
      case 'continue': { const s = loadSave(); if (!s) { toast('저장된 게임이 없어요.', true); return; } S = s; ui.screen = 'game'; resetSelection(); render(); toast(`${S.day}일차부터 이어서 해요.`); return; }
      case 'help': ui.modal = 'help'; render(); return;
      case 'close-modal': ui.modal = null; render(); return;
      case 'menu': ui.screen = 'menu'; ui.modal = null; render(); return;
      case 'reset': ui.modal = 'reset'; render(); return;
      case 'confirm-reset': clearSave(); startNew(); return;
      case 'view-log': { const ov = document.querySelector('.overlay'); if (ov) ov.remove(); return; }
      case 'open-chars': ui.modal = null; ui.intro = { type: 'chars', idx: 0, from: 'help' }; render(); return;
      case 'open-tour': ui.modal = null; resetSelection(); ui.intro = { type: 'tour', step: 0, from: 'help' }; render(); return;
      case 'intro-go': ui.intro.idx = Number(v); render(); return;
      case 'intro-prev': ui.intro.idx = Math.max(0, ui.intro.idx - 1); render(); return;
      case 'intro-next':
        if (ui.intro.idx < G.CHARACTERS.length - 1) { ui.intro.idx++; render(); return; }
        if (ui.intro.from === 'first') { ui.intro = { type: 'tour', step: 0, from: 'first' }; render(); return; }
        ui.intro = null; render(); return;
      case 'intro-skip':
        if (ui.intro.from === 'first') { ui.intro = { type: 'tour', step: 0, from: 'first' }; render(); return; }
        ui.intro = null; render(); return;
      case 'tour-prev': ui.intro.step = Math.max(0, ui.intro.step - 1); render(); return;
      case 'tour-next':
        if (ui.intro.step < TOUR.length - 1) { ui.intro.step++; render(); return; }
        finishIntro(); render(); return;
      case 'tour-skip': ui.intro = null; setTutDone(); render(); return;
      case 'log-all': ui.logAll = !ui.logAll; render(); return;
    }
    if (ui.intro) return;
    if (!S || S.ended) { if (S && S.ended) toast('게임이 끝났어요. 새 게임을 시작하세요.', true); return; }
    switch (a) {
      case 'select': ui.sel = ui.sel === v ? null : v; ui.action = null; ui.target = null; break;
      case 'pick-action':
        ui.action = v; ui.target = null; ui.keepPlanScroll = true;
        if (v === 'treat') { const d = S.survivors.find((x) => x.id !== ui.sel && x.status === 'dying') || S.survivors.find((x) => x.id !== ui.sel && x.status === 'ok' && x.hp < x.maxHp); if (d) ui.target = d.id; }
        if (v === 'talk' && ui.sel !== 'gayoon' && G.able(S, 'gayoon') && G.gayoonState(S) !== '안정') ui.target = 'gayoon';
        if (v === 'lure') ui.lureMode = G.available(S, 'noisemakers') > 0 ? 'device' : 'manual';
        if (v === 'fortify') ui.useMaterial = false;
        if (v === 'craft' && G.available(S, 'materials') < G.RECIPES[ui.recipe].cost) { const r = Object.keys(G.RECIPES).find((k) => G.RECIPES[k].cost <= G.available(S, 'materials')); if (r) ui.recipe = r; }
        break;
      case 'pick-loc': ui.loc = v; ui.keepPlanScroll = true; break;
      case 'pick-mode': ui.mode = v; ui.keepPlanScroll = true; break;
      case 'pick-target': ui.target = v; ui.keepPlanScroll = true; break;
      case 'pick-recipe': ui.recipe = v; ui.keepPlanScroll = true; break;
      case 'pick-lure': ui.lureMode = v; ui.keepPlanScroll = true; break;
      case 'pick-mat': ui.useMaterial = v === '1'; ui.keepPlanScroll = true; break;
      case 'assign': {
        const r = G.assign(S, currentPlan());
        if (!r.ok) { toast(r.error, true); break; }
        toast(`✓ ${G.describeAssignment(S.assignments[S.assignments.length - 1])}`);
        resetSelection(); save();
        break;
      }
      case 'unassign': { const r = G.unassign(S, Number(v)); if (!r.ok) toast(r.error, true); else { toast('배정을 취소했어요.'); save(); } break; }
      case 'run-day': {
        if (S.phase !== 'morning') return;
        const start = S.log.length;
        const r = G.runDay(S);
        if (!r.ok) { toast(r.error, true); break; }
        makeSpotlight(start);
        resetSelection(); save(); toast('낮 행동 완료! 밤 대비를 확인하세요.');
        break;
      }
      case 'run-night': {
        if (S.phase !== 'evening') return;
        const start = S.log.length;
        const r = G.runNight(S);
        if (!r.ok) { toast(r.error, true); break; }
        makeSpotlight(start);
        save();
        toast(S.ended ? S.ended.title : `${S.day}일차 아침이 밝았어요.`);
        break;
      }
      default: return;
    }
    render();
  });

  document.addEventListener('change', (ev) => {
    const el = ev.target;
    if (!S || S.ended || !el.dataset) return;
    if (el.dataset.a === 'night') {
      const r = G.setNightOption(S, el.dataset.v, el.checked);
      if (!r.ok) toast(r.error, true); else save();
      ui.keepPlanScroll = true;
      render();
    }
  });
  window.addEventListener('resize', positionTour);
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && ui.intro) {
      if (ui.intro.type === 'chars' && ui.intro.from === 'first') ui.intro = { type: 'tour', step: 0, from: 'first' };
      else { ui.intro = null; setTutDone(); }
      render(); return;
    } if (ev.key === 'Escape' && ui.modal) { ui.modal = null; render(); } });

  render();
})();
</script>
</body>
</html>
