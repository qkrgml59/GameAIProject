<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방과후 생존반: 좀비 학교 생존 시뮬레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 디자인 토큰 (기획서: 어두운 남색 배경 고정) ===== */
:root {
  color-scheme: dark;
  --bg: #0f1624;
  --panel: #17213a;
  --panel-2: #1f2c4a;
  --panel-3: #263759;
  --line: #2c3c60;
  --text: #ece7da;
  --muted: #95a1b8;
  --accent: #f0b429;
  --danger: #ef5b52;
  --good: #63c58e;
  --threat: #a184f2;
  --morale: #f2c94c;
  --food: #e8975a;
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1624; } }
:root[data-theme="dark"] { --bg: #0f1624; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; }
#app { height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; letter-spacing: .01em; }
.tape { height: 8px; background: repeating-linear-gradient(-45deg, var(--accent) 0 14px, #1a1a1a 14px 28px); flex: none; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ===== 공통 버튼 ===== */
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 9px 14px; text-align: left; transition: background .12s, transform .08s; }
.btn:hover:not(:disabled) { background: var(--panel-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: #1b1404; border-color: var(--accent); font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: #ffc53d; }
.btn.danger { border-color: #6b2a28; color: #ffb4ae; }
.btn:disabled { opacity: .4; }
.btn.ghost { background: transparent; }

/* ===== 메인 화면 ===== */
.menu { min-height: 100%; display: grid; place-items: center; padding: 24px; }
.menu-inner { width: min(560px, 100%); min-width: 0; }
.menu h1 { font-size: clamp(44px, 10vw, 76px); line-height: 1.02; margin: 18px 0 10px; }
.menu .sub { color: var(--muted); margin: 0 0 28px; max-width: 46ch; }
.menu-btns { display: grid; gap: 10px; }
.menu .btn { font-size: 17px; padding: 14px 18px; }

/* ===== 캐릭터 그림 ===== */
.pf, .fb { display: block; flex: none; background-repeat: no-repeat; background-position: center bottom; background-size: contain; }
.pf { width: 52px; height: 52px; border-radius: 10px; background-color: color-mix(in srgb, var(--c, #3a4a6e) 24%, #1a2440); }
.pf.xs { width: 24px; height: 24px; border-radius: 6px; }
.pf.sm { width: 34px; height: 34px; border-radius: 8px; }
.pf.lg { width: 92px; height: 92px; border-radius: 14px; }
.fb { width: 80px; height: 140px; }
.lineup { display: flex; justify-content: space-between; align-items: flex-end; gap: 2px; margin-top: 30px; }
.lineup figure { margin: 0; text-align: center; flex: 1 1 0; min-width: 0; }
.lineup .fb { width: 100%; height: clamp(110px, 22vw, 190px); }
.lineup figcaption { font-size: 13px; color: var(--muted); border-top: 3px solid var(--c); padding-top: 4px; margin-top: 2px; }

/* ===== 게임 셸: 한 화면 ===== */
.shell { height: 100%; display: flex; flex-direction: column; }
.hud { flex: none; display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; }
.day-badge { font-family: var(--display); font-size: 28px; line-height: 1; white-space: nowrap; }
.day-badge small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); margin-top: 3px; }
.steps { display: flex; gap: 4px; align-items: center; }
.step { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; background: var(--panel); color: var(--muted); white-space: nowrap; }
.step.done { color: var(--good); }
.step.now { background: var(--accent); color: #1b1404; font-weight: 700; }
.step-arrow { color: var(--line); font-size: 12px; }
.res { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
.chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; background: var(--panel); border: 1px solid transparent; font-size: 13.5px; white-space: nowrap; }
.chip b { font-size: 16px; }
.chip.warn { border-color: var(--danger); background: #2b1a22; }
.chip .bar { width: 46px; height: 6px; border-radius: 3px; background: var(--panel-3); overflow: hidden; }
.chip .bar i { display: block; height: 100%; }
.chip.mini { padding: 5px 8px; }
.hud-menu { display: flex; gap: 4px; }
.hud-menu .btn { padding: 6px 10px; font-size: 13px; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr) 330px; gap: 12px; padding: 12px 16px; }
.col { min-height: 0; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.col-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.col-title h2 { font-size: 19px; }

/* ===== 생존자 카드 (간결) ===== */
.roster { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { position: relative; background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px; padding: 8px; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; }
.card:hover { background: var(--panel-3); }
.card.sel { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--panel-3); }
.card.dying { border-color: var(--danger); background: #2b1a22; }
.card.dead { opacity: .4; filter: grayscale(.9); }
.card.busy .pf { opacity: .55; }
.card .pf { grid-row: span 2; width: 46px; height: 46px; }
.cname { font-weight: 700; font-size: 15px; line-height: 1.15; }
.crole { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; max-width: 100%; }
.card > span:nth-of-type(2) { min-width: 0; }
.hp { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.hpbar { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--good); }
.hpbar i.low { background: var(--accent); }
.hpbar i.crit { background: var(--danger); }
.tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 3px; min-height: 18px; }
.tag { font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); line-height: 17px; }
.tag.bad { border-color: #7a2f2b; color: #ffb4ae; }
.tag.ok { border-color: #2d6a48; color: #a6f0c6; }
.task { position: absolute; top: 6px; right: 6px; font-size: 11px; font-weight: 700; color: #1b1404; background: var(--accent); border-radius: 99px; padding: 0 7px; line-height: 18px; }

/* ===== 계획 패널 ===== */
.howto { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.howto span { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.howto span.on { background: color-mix(in srgb, var(--accent) 22%, var(--panel-2)); color: var(--text); }
.notice { display: grid; gap: 8px; }
.notice-item { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); font-size: 14px; }
.notice-item.bad { background: #2b1a22; border-left: 3px solid var(--danger); }
.notice-item .ico { font-size: 20px; flex: none; }
.who-head { display: flex; gap: 14px; align-items: flex-end; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.who-head .fb { width: 58px; height: 102px; }
.who-head .nm { font-family: var(--display); font-size: 26px; line-height: 1.1; }
.who-head .trait { font-size: 13px; color: var(--muted); margin-top: 4px; max-width: 60ch; }
.who-head .trait b { color: var(--text); font-weight: 500; }
.sec { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
.acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.act { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 9px 6px; text-align: center; display: grid; gap: 2px; justify-items: center; }
.act .ai { font-size: 22px; line-height: 1.1; }
.act .an { font-weight: 700; font-size: 14px; }
.act .ad { font-size: 11px; color: var(--muted); line-height: 1.3; }
.act:hover:not(:disabled) { background: var(--panel-3); }
.act.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--panel-2)); }
.act:disabled { opacity: .38; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line); background: var(--panel-2); border-radius: 99px; padding: 6px 12px; font-size: 13.5px; }
.opt.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel-2)); }
.opt:disabled { opacity: .4; }
.schoolmap { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.room { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 8px 6px; text-align: center; display: grid; gap: 1px; justify-items: center; }
.room .ri { font-size: 20px; }
.room .rn { font-weight: 700; font-size: 13.5px; }
.room .rd { font-size: 11px; color: var(--muted); }
.room .rk { font-size: 11.5px; font-weight: 700; }
.room.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); }
.plan-foot { position: sticky; bottom: -14px; margin: 14px -14px -14px; padding: 12px 14px 14px; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -10px 18px rgba(0,0,0,.25); }
.preview { padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 13.5px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 22px; }
.preview .riskbar, .preview .err, .preview .row.full { grid-column: 1 / -1; }
.mode-row { align-items: center; margin-bottom: 8px; }
.compact .who-head { padding-bottom: 8px; margin-bottom: 4px; }
.compact .who-head .trait { display: none; }
.compact .who-head .fb { width: 38px; height: 66px; }
.compact .who-head .nm { font-size: 22px; }
.compact .act { padding: 6px; grid-template-columns: auto auto; justify-content: center; align-items: center; gap: 6px; }
.compact .act .ai { font-size: 17px; }
.compact .act .ad { display: none; }
.compact .sec { margin-top: 10px; }
.preview .row { display: flex; justify-content: space-between; gap: 10px; }
.preview .row > span:first-child { flex: none; color: var(--muted); }
.preview .row > span:last-child { text-align: right; }
.riskbar { height: 8px; border-radius: 4px; background: var(--panel-3); overflow: hidden; }
.riskbar i { display: block; height: 100%; }
.risk-low { color: var(--good); } .risk-mid { color: var(--accent); } .risk-high { color: var(--danger); }
.err { color: #ffb4ae; font-size: 13px; }
.assign-btn { width: 100%; text-align: center; font-size: 16px; padding: 12px; margin-top: 10px; }

/* 저녁: 결과·밤 대비 */
.spot { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.bubble { position: relative; flex: 1; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; font-size: 14px; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 22px; border: 8px solid transparent; border-left: 0; border-right-color: var(--line); }
.bubble b { display: block; margin-bottom: 2px; }
.bubble p { margin: 0; }
.delta { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 4px; }
.delta span { font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--panel-2); }
.delta .up { color: var(--good); } .delta .down { color: #ff9a92; }
.raid { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); margin-top: 8px; }
.raid .pct { font-family: var(--display); font-size: 40px; line-height: 1; }
.raid .meta { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.toggles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.toggle { display: grid; gap: 4px; padding: 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); font-size: 13px; cursor: pointer; }
.toggle:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel-2)); }
.toggle:has(input:disabled) { opacity: .45; cursor: not-allowed; }
.toggle .tt { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

/* ===== 기록 ===== */
.log { display: grid; gap: 2px; font-size: 13.5px; }
.log .day-sep { font-family: var(--display); color: var(--muted); margin: 10px 0 4px; }
.le { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 5px 6px; border-radius: 6px; align-items: start; }
.le .ph { display: block; font-size: 11px; color: var(--muted); }
.le.good { background: rgba(99,197,142,.08); }
.le.bad { background: rgba(239,91,82,.13); }
.le.warn { background: rgba(240,180,41,.09); }
.le.event .ph { color: var(--accent); }
.le .dot { width: 24px; height: 24px; border-radius: 6px; background: var(--panel-2); display: grid; place-items: center; font-size: 12px; }
.linkbtn { background: none; border: none; color: var(--muted); font-size: 12.5px; text-decoration: underline; padding: 0; }

/* ===== 하단 명령 바 ===== */
.cmd { flex: none; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.slots { display: flex; gap: 6px; flex: none; }
.slot { width: 58px; height: 58px; border-radius: 10px; border: 2px dashed var(--line); display: grid; place-items: center; position: relative; background: transparent; padding: 0; color: var(--muted); font-size: 11px; }
.slot.assign { border: 2px solid var(--accent); background: var(--panel-2); }
.slot.assign .pf { width: 48px; height: 48px; }
.slot .si { position: absolute; right: -6px; bottom: -6px; font-size: 15px; background: var(--panel); border-radius: 99px; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--line); }
.slot .sx { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 99px; background: var(--danger); color: #fff; font-size: 13px; line-height: 20px; text-align: center; }
.slot.bonus { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.hint { flex: 1; min-width: 0; font-size: 14.5px; }
.hint b { color: var(--accent); }
.cta { flex: none; font-size: 17px; padding: 14px 26px; text-align: center; min-width: 210px; }

/* ===== 오버레이 ===== */
.overlay { position: fixed; inset: 0; background: rgba(6,10,18,.78); display: grid; place-items: center; z-index: 20; padding: 20px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; width: min(620px, 100%); max-height: 85vh; overflow-y: auto; }
.modal h2 { font-size: 30px; margin-bottom: 8px; }
.modal ul { padding-left: 20px; margin: 6px 0 12px; }
.modal li { margin: 3px 0; }
.end-cast { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.end-cast .pf.dead { filter: grayscale(1); opacity: .45; }

/* ===== 생존반 소개창 ===== */
.intro-modal { width: min(880px, 100%); padding: 18px 20px; display: grid; gap: 12px; }
.intro-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.intro-top h2 { font-size: 24px; margin: 0; }
.intro-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 3px; }
.intro-tabs button { border: 2px solid transparent; background: none; padding: 0; border-radius: 13px; flex: none; position: relative; }
.intro-tabs button.on { border-color: var(--accent); }
.intro-tabs button.seen::after { content: "✓"; position: absolute; right: -3px; top: -3px; width: 16px; height: 16px; border-radius: 99px; background: var(--good); color: #0f1624; font-size: 11px; line-height: 16px; text-align: center; font-weight: 700; }
.intro-tabs .pf { width: 50px; height: 50px; }
.intro-body { display: grid; grid-template-columns: 230px 1fr; gap: 22px; align-items: center; }
.intro-art { height: 330px; border-radius: 18px; display: flex; align-items: flex-end; justify-content: center; background: radial-gradient(ellipse at 50% 70%, color-mix(in srgb, var(--c) 40%, transparent), transparent 70%), var(--panel-2); }
.intro-art .fb { width: 200px; height: 318px; }
.intro-info .nm { font-family: var(--display); font-size: 42px; line-height: 1; }
.intro-info .role { color: var(--muted); margin-top: 4px; }
.intro-info h4 { font-size: 13px; color: var(--muted); margin: 14px 0 4px; font-weight: 500; }
.intro-info ul { margin: 0; padding-left: 18px; }
.intro-info li { margin: 2px 0; }
.intro-info p { margin: 0; }
.intro-hp { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.intro-hp .hpbar { max-width: 180px; height: 7px; background: var(--bg); }
.tipbox { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border-left: 3px solid var(--c); font-size: 14px; }
.intro-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; bottom: -18px; margin: 0 -20px -18px; padding: 12px 20px 16px; background: var(--panel); border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; }
.intro-nav .btn { min-width: 120px; text-align: center; }
/* ===== 화면 안내 튜토리얼 ===== */
.tour-block { position: fixed; inset: 0; z-index: 40; }
.tour-hole { position: fixed; z-index: 41; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(5, 9, 16, .76); outline: 3px solid var(--accent); pointer-events: none; transition: top .25s, left .25s, width .25s, height .25s; }
.tour-card { position: fixed; z-index: 42; width: min(350px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; box-shadow: 0 14px 34px rgba(0, 0, 0, .55); }
.tour-card h3 { font-size: 21px; margin: 4px 0 6px; }
.tour-card p { margin: 0 0 12px; font-size: 14px; }
.tour-card .nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tour-card .nav .btn { padding: 7px 14px; }
.tour-dots { display: flex; gap: 4px; }
.tour-dots i { width: 7px; height: 7px; border-radius: 99px; background: var(--line); }
.tour-dots i.on { background: var(--accent); }
@media (max-width: 820px) {
  .intro-modal { padding: 14px; max-height: 90vh; }
  .intro-nav { bottom: -14px; margin: 0 -14px -14px; padding: 10px 14px 12px; }
  .intro-body { grid-template-columns: 1fr; gap: 10px; }
  .intro-art { height: 190px; }
  .intro-art .fb { width: 120px; height: 186px; }
  .intro-info .nm { font-size: 30px; }
  .intro-tabs .pf { width: 40px; height: 40px; }
}
@media (prefers-reduced-motion: reduce) { .tour-hole { transition: none; } }

.toast { z-index: 50; position: fixed; left: 50%; top: calc(74px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--accent); color: #1b1404; font-weight: 700; padding: 9px 18px; border-radius: 8px; z-index: 30; box-shadow: 0 6px 24px rgba(0,0,0,.4); max-width: 90vw; }
.toast.err { background: var(--danger); color: #fff; }

/* ===== 중간 화면: 기록을 아래로 ===== */
@media (max-width: 1280px) {
  .main { grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 160px; }
  .main > .col-log { grid-column: 1 / -1; }
  .res .chip.mini { display: none; }
}
/* ===== 모바일: 위에서 아래로 흐르고, 명령 바는 화면 아래 고정 ===== */
@media (max-width: 820px) {
  #app { height: auto; min-height: 100%; }
  .shell { height: auto; min-height: 100%; }
  .hud { gap: 8px; padding: 8px 12px; }
  .day-badge { font-size: 22px; }
  .steps { order: 3; width: 100%; overflow-x: auto; }
  .res { order: 4; width: 100%; justify-content: flex-start; gap: 4px; }
  .chip { padding: 4px 7px; font-size: 12.5px; }
  .chip b { font-size: 14px; }
  .chip .bar { width: 30px; }
  .res .chip.mini { display: flex; }
  .hud-menu { margin-left: auto; }
  .main { display: flex; flex-direction: column; padding: 10px 12px 12px; }
  .col { overflow: visible; }
  .roster { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .card { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 6px 4px; border-left-width: 1px; border-top: 3px solid var(--c); }
  .card .pf { grid-row: auto; width: 44px; height: 44px; }
  .card .crole, .card .tags { display: none; }
  .hp > span:first-child, .hp > span:last-child { display: none; }
  .card .hp { width: 100%; padding: 0 4px; }
  .task { top: 2px; right: 2px; font-size: 10px; padding: 0 5px; }
  .acts { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .act .ad { display: none; }
  .schoolmap { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .toggles { grid-template-columns: 1fr; }
  .who-head .fb { width: 58px; height: 100px; }
  .cmd { position: sticky; bottom: 0; z-index: 6; flex-wrap: wrap; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .slot { width: 46px; height: 46px; }
  .slot.assign .pf { width: 38px; height: 38px; }
  .hint { order: -1; flex: 1 1 100%; font-size: 13px; }
  .cta { flex: 1; min-width: 0; padding: 12px; font-size: 16px; }
  .toast { top: calc(12px + env(safe-area-inset-top, 0px)); }
  .plan-foot { position: static; margin: 12px 0 0; padding: 0; background: none; border: 0; box-shadow: none; }
  .preview { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    { id: 'minseong', name: '민성', role: '전투 담당', trait: '위기 대응', maxHp: 110, color: '#E9E9EC',
      traitDesc: '방어 준비 중 습격이 오면 좀비를 처치해 위협도를 추가로 −10. 아저씨 농담은 사기를 깎기도, 긴장을 풀기도 한다.' },
    { id: 'jeongmin', name: '정민', role: '게이머', trait: '공략 지식', maxHp: 95, color: '#6F7C99',
      traitDesc: '탐색 위험 −8, 소음 유인 효과 +5. 상황별 공략 팁을 낸다. 행동 시 10% 확률로 돌발 행동(소음 또는 엉뚱한 유인).' },
    { id: 'yongchan', name: '용찬', role: '식량 담당', trait: '식량 확보', maxHp: 105, color: '#9B6BDB',
      traitDesc: '급식실 탐색 시 식량 +2. 기본 식사와 별도로 하루 식량 1개를 더 먹는다. 탐색 중 20% 확률로 소음. 위험하면 도망쳐 피해 절반.' },
  ];
  const CHAR = Object.fromEntries(CHARACTERS.map((c) => [c.id, c]));
  const nm = (id) => CHAR[id].name;

  /* ---------- 데이터: 학교 장소 (확장 가능 구조) ---------- */
  const LOCATIONS = {
    rooftop:   { name: '옥상',   desc: '주변 확인 · 구조 신호', base: 18, loot: 'signal', sunny: true, explorable: true },
    library:   { name: '도서관', desc: '정보 수집 · 위험 분석', base: 12, loot: 'intel', explorable: true },
    science:   { name: '과학실', desc: '제작 재료 탐색',        base: 25, loot: 'materials', min: 1, max: 3, explorable: true },
    classroom: { name: '교실',   desc: '거점 · 휴식 · 제작',    explorable: false },
    nurse:     { name: '보건실', desc: '의약품 탐색 · 치료',    base: 20, loot: 'medicine', min: 1, max: 2, explorable: true },
    cafeteria: { name: '급식실', desc: '식량 탐색',             base: 22, loot: 'food', min: 3, max: 6, explorable: true },
  };
  const LOOT_NAME = { food: '식량', materials: '재료', medicine: '의약품' };

  const MODES = {
    quiet:  { name: '조용히',   noise: 1, danger: -8, loot: 0.7, desc: '들킬 확률↓ 수확↓' },
    normal: { name: '일반',     noise: 3, danger: 0,  loot: 1.0, desc: '기본' },
    run:    { name: '서둘러',   noise: 6, danger: 6,  loot: 1.4, desc: '수확↑ 소음↑' },
  };

  const WEATHER = {
    sunny:  { name: '맑음', icon: '☀️', danger: -12, sun: '강함', noiseMul: 1 },
    cloudy: { name: '흐림', icon: '☁️', danger: -4,  sun: '약함', noiseMul: 1 },
    rain:   { name: '비',   icon: '🌧️', danger: 2,   sun: '없음', noiseMul: 0.6 },
    fog:    { name: '안개', icon: '🌫️', danger: 6,   sun: '없음', noiseMul: 1 },
  };
  const WEATHER_TABLE = [['sunny', 40], ['cloudy', 30], ['rain', 20], ['fog', 10]];

  const ACTIONS = {
    explore: { name: '탐색',      desc: '장소에서 자원 확보' },
    rest:    { name: '휴식',      desc: '체력 +20, 사기 +1' },
    treat:   { name: '치료',      desc: '부상자·빈사자 치료' },
    fortify: { name: '쉘터 정비', desc: '방어력 상승 (망치 소음)' },
    craft:   { name: '도구 제작', desc: '재료로 장비 제작' },
    defend:  { name: '방어 준비', desc: '오늘 밤 습격 대비' },
    talk:    { name: '대화',      desc: '동료 마음 돌보기' },
    lure:    { name: '소음 유인', desc: '좀비를 다른 곳으로' },
  };

  const RECIPES = {
    barricade:  { name: '책상 바리케이드', cost: 2, desc: '방어력 +15' },
    uvlamp:     { name: 'UV 랜턴',         cost: 3, desc: 'UV 배터리 +3 (밤에 켜면 습격 억제)' },
    noisemaker: { name: '알람시계 소음기', cost: 1, desc: '소음 유인을 안전하게 (1회용)' },
  };

  /* 승리 조건: 학교 탈출 등은 이 배열에 추가해 확장 */
  const VICTORY_CONDITIONS = [
    { id: 'survive', check: (s) => s.day > 14, title: '15일째 아침을 맞았다',
      text: '학교는 여전히 위험하지만, 생존반은 2주를 버텨냈다. 이제 탈출을 준비할 차례다. (학교 탈출 단계는 다음 확장에서 이어집니다.)' },
    { id: 'rescue', check: (s) => s.rescueSignals >= 6, title: '구조 신호에 응답이 왔다',
      text: '옥상에서 보낸 신호를 누군가 받았다. 무전기 너머로 합류 지점이 전해진다. (탈출 작전은 다음 확장에서 이어집니다.)' },
  ];

  /* ---------- 상태 ---------- */
  function newGame() {
    const s = {
      version: 1, day: 1, phase: 'morning', ended: null,
      food: 16, materials: 2, medicine: 1, uvBattery: 0, noisemakers: 0,
      morale: 60, threat: 20, defense: 20, prep: 0,
      intel: 0, locationNotes: {}, rescueSignals: 0, hungerDays: 0,
      weather: 'sunny', noiseToday: 0, injuredToday: false, defenders: [],
      gayoonMental: 25, dongkeunTrust: 30, juyeonIdea: false, crisisFlag: false,
      night: { uv: false, hush: false, ration: false },
      assignments: [],
      survivors: CHARACTERS.map((c) => ({ id: c.id, hp: c.maxHp, maxHp: c.maxHp, status: 'ok', dyingDays: 0 })),
      log: [], summary: null,
      stats: { explores: 0, raids: 0, repelled: 0, deaths: 0, crafted: 0 },
    };
    addLog(s, '아침', '좀비 사태 발생 직후. 생존자 8명이 학교 교실에 바리케이드를 치고 모였다.', 'neutral');
    addLog(s, '아침', '가윤은 충격으로 멍하니 앉아 있다. 누군가 말을 걸어주면 정신을 차릴지도 모른다.', 'warn');
    morningReport(s);
    return s;
  }

  /* ---------- 상태 조회 ---------- */
  const sv = (s, id) => s.survivors.find((p) => p.id === id);
  const able = (s, id) => sv(s, id).status === 'ok';
  const aliveList = (s) => s.survivors.filter((p) => p.status !== 'dead');
  const ableList = (s) => s.survivors.filter((p) => p.status === 'ok');
  const aliveCount = (s) => aliveList(s).length;
  function isCrisis(s) { return s.morale < 30 || s.threat >= 70 || s.food < aliveCount(s); }
  function maxAP(s) { return 3 + (able(s, 'hyerin') && isCrisis(s) ? 1 : 0); }
  function gayoonState(s) { return s.gayoonMental < 30 ? '충격' : s.gayoonMental < 60 ? '불안' : '안정'; }
  function trustLabel(s) { return s.dongkeunTrust < 30 ? '의심' : s.dongkeunTrust < 60 ? '알 수 없음' : '신뢰'; }
  function efficiency(s, id) {
    let e = 1;
    if (id === 'gayoon') e = { '충격': 0.5, '불안': 0.8, '안정': 1.3 }[gayoonState(s)];
    if (s.morale < 25) e *= 0.85;
    return e;
  }
  function reserved(s, res) {
    let n = 0;
    for (const a of s.assignments) {
      if (res === 'materials' && a.action === 'craft') n += RECIPES[a.recipe].cost;
      if (res === 'materials' && a.action === 'fortify' && a.useMaterial) n += 1;
      if (res === 'medicine' && a.action === 'treat') n += 1;
      if (res === 'noisemakers' && a.action === 'lure' && a.lureMode === 'device') n += 1;
    }
    return n;
  }
  const available = (s, res) => Math.max(0, s[res] - reserved(s, res));

  function addLog(s, phase, text, tone) {
    s.log.push({ day: s.day, phase, text, tone: tone || 'neutral' });
    if (s.log.length > 300) s.log.splice(0, s.log.length - 300);
  }
  function normalize(s) {
    for (const k of ['food', 'materials', 'medicine', 'uvBattery', 'noisemakers', 'rescueSignals', 'intel'])
      s[k] = Math.max(0, Math.round(s[k]));
    s.morale = clamp(Math.round(s.morale), 0, 100);
    s.threat = clamp(Math.round(s.threat), 0, 100);
    s.defense = clamp(Math.round(s.defense), 0, 100);
    s.prep = clamp(Math.round(s.prep), 0, 100);
    s.gayoonMental = clamp(Math.round(s.gayoonMental), 0, 100);
    s.dongkeunTrust = clamp(Math.round(s.dongkeunTrust), 0, 100);
    for (const p of s.survivors) p.hp = clamp(Math.round(p.hp), 0, p.maxHp);
  }

  /* ---------- 위험도 계산 (빛·날씨·소음·특성 반영) ---------- */
  function exploreDanger(s, sid, loc, mode) {
    const L = LOCATIONS[loc], W = WEATHER[s.weather];
    let d = L.base + s.threat * 0.35 + W.danger + MODES[mode].danger;
    if (L.sunny && s.weather === 'sunny') d -= 10;          // 햇빛이 강한 구역
    if (s.intel > 0) d -= 10;
    if (s.locationNotes[loc]) d -= 8;                        // 지난 실패에서 얻은 정보
    if (s.morale < 25) d += 5;
    if (sid) {
      if (sid === 'jeongmin') d -= 8;
      if (sid === 'hyerin' && isCrisis(s)) d -= 10;
      const p = sv(s, sid);
      if (p.hp < 40) d += 8;
    }
    return Math.round(clamp(d, 5, 85));
  }
  function lureDanger(s, sid) {
    let d = 22 + s.threat * 0.2;
    if (sid === 'hyerin' || sid === 'yongchan') d -= 10;
    if (s.weather === 'sunny') d -= 6;
    return Math.round(clamp(d, 5, 60));
  }
  function riskLabel(d) { return d < 25 ? '낮음' : d < 45 ? '보통' : d < 65 ? '높음' : '매우 높음'; }
  function riskReport(s, d) {
    const label = riskLabel(d);
    if (!able(s, 'pyeongoh')) return { label, range: null, note: '평오가 분석할 수 없어 대략적인 위험만 보인다.' };
    if (s.threat >= 70) return { label, range: [clamp(d - 15, 0, 100), clamp(d + 15, 0, 100)], note: '평오: “자, 잠깐만… 숫자가 안 잡혀!” 위기라 분석이 흐려졌다.' };
    return { label, range: [clamp(d - 5, 0, 100), clamp(d + 5, 0, 100)], note: '평오의 분석' };
  }
  function lootRange(s, sid, loc, mode) {
    const L = LOCATIONS[loc];
    if (!L.min) return null;
    const mult = MODES[mode].loot * efficiency(s, sid) * (s.morale >= 75 ? 1.1 : 1);
    let add = 0;
    if (sid === 'yongchan' && loc === 'cafeteria') add += 2;
    if (sid === 'gayoon' && gayoonState(s) === '안정' && (loc === 'cafeteria' || loc === 'science')) add += 1;
    return { res: L.loot, min: Math.max(1, Math.round(L.min * mult) + add), max: Math.max(1, Math.round(L.max * mult) + add) };
  }
  function nightNoise(s) {
    let n = s.noiseToday * WEATHER[s.weather].noiseMul;
    if (s.night.hush) n *= 0.5;
    return n;
  }
  function projectedThreat(s) {
    return clamp(Math.round(s.threat + nightNoise(s) * 1.2 + 4 + (s.injuredToday ? 4 : 0)), 0, 100);
  }
  function uvActive(s) { return s.night.uv && s.uvBattery > 0; }
  function raidChance(s, threat) {
    const t = threat == null ? projectedThreat(s) : threat;
    return Math.round(clamp(t * 0.9 - s.defense * 0.5 - s.prep * 0.8 - (uvActive(s) ? 25 : 0), 3, 85));
  }
  function defendValue(s, sid) {
    let v = 15;
    if (sid === 'dongkeun') v = 30;
    v *= efficiency(s, sid);
    return Math.round(v);
  }
  function fortifyValue(s, sid, useMat) {
    return Math.round((8 + (useMat ? 6 : 0)) * efficiency(s, sid));
  }

  /* ---------- 배정 ---------- */
  function validate(s, plan) {
    if (s.ended) return '게임이 끝났습니다.';
    if (s.phase !== 'morning') return '아침(행동 선택) 단계에서만 배정할 수 있습니다.';
    const p = plan.sid && sv(s, plan.sid);
    if (!p) return '생존자를 선택하세요.';
    if (p.status === 'dead') return `${nm(p.id)}은(는) 세상을 떠났습니다.`;
    if (p.status === 'dying') return `${josa(nm(p.id), '은/는')} 빈사 상태라 움직일 수 없습니다. 치료가 필요합니다.`;
    if (s.assignments.some((a) => a.sid === plan.sid)) return `${josa(nm(p.id), '은/는')} 이미 오늘 할 일이 있습니다.`;
    if (s.assignments.length >= maxAP(s)) return '오늘 행동력을 모두 썼습니다.';
    if (!ACTIONS[plan.action]) return '행동을 선택하세요.';
    switch (plan.action) {
      case 'explore':
        if (!LOCATIONS[plan.loc] || !LOCATIONS[plan.loc].explorable) return '탐색할 장소를 선택하세요.';
        if (!MODES[plan.mode]) return '이동 방식을 선택하세요.';
        break;
      case 'treat': {
        const t = plan.target && sv(s, plan.target);
        if (!t) return '치료할 사람을 선택하세요.';
        if (t.id === plan.sid) return '자기 자신은 치료할 수 없습니다. 휴식을 선택하세요.';
        if (t.status === 'dead') return '이미 늦었습니다.';
        if (t.status === 'ok' && t.hp >= t.maxHp) return `${josa(nm(t.id), '은/는')} 다친 곳이 없습니다.`;
        if (s.assignments.some((a) => a.action === 'treat' && a.target === t.id)) return '이미 다른 사람이 치료하기로 했습니다.';
        break;
      }
      case 'talk': {
        const t = plan.target && sv(s, plan.target);
        if (!t) return '대화할 사람을 선택하세요.';
        if (t.id === plan.sid) return '혼잣말은 사기를 올리지 않습니다.';
        if (t.status !== 'ok') return '대화할 수 있는 상태가 아닙니다.';
        break;
      }
      case 'craft':
        if (!RECIPES[plan.recipe]) return '만들 도구를 선택하세요.';
        if (available(s, 'materials') < RECIPES[plan.recipe].cost) return `재료가 부족합니다. (필요 ${RECIPES[plan.recipe].cost}, 남은 재료 ${available(s, 'materials')})`;
        break;
      case 'fortify':
        if (plan.useMaterial && available(s, 'materials') < 1) return '사용할 재료가 없습니다.';
        break;
      case 'lure':
        if (plan.lureMode === 'device' && available(s, 'noisemakers') < 1) return '소음기가 없습니다. 직접 뛰어가거나 과학실에서 만들어야 합니다.';
        if (plan.lureMode !== 'device' && plan.lureMode !== 'manual') return '유인 방법을 선택하세요.';
        break;
    }
    return null;
  }
  function assign(s, plan) {
    const err = validate(s, plan);
    if (err) return { ok: false, error: err };
    s.assignments.push({
      sid: plan.sid, action: plan.action, loc: plan.loc || null, mode: plan.mode || 'normal',
      target: plan.target || null, recipe: plan.recipe || null, useMaterial: !!plan.useMaterial,
      lureMode: plan.lureMode || 'manual',
    });
    return { ok: true };
  }
  function unassign(s, index) {
    if (s.ended || s.phase !== 'morning') return { ok: false, error: '지금은 바꿀 수 없습니다.' };
    if (index < 0 || index >= s.assignments.length) return { ok: false, error: '없는 배정입니다.' };
    s.assignments.splice(index, 1);
    // 혜린 보너스가 사라져 행동력을 넘으면 뒤에서부터 정리
    while (s.assignments.length > maxAP(s)) s.assignments.pop();
    return { ok: true };
  }
  function describeAssignment(a) {
    const who = nm(a.sid);
    switch (a.action) {
      case 'explore': return `${who}: ${LOCATIONS[a.loc].name} 탐색 (${MODES[a.mode].name})`;
      case 'treat': return `${who}: ${nm(a.target)} 치료`;
      case 'talk': return `${who}: ${josa(nm(a.target), '과/와')} 대화`;
      case 'craft': return `${who}: ${RECIPES[a.recipe].name} 제작`;
      case 'fortify': return `${who}: 쉘터 정비${a.useMaterial ? ' (재료 1 사용)' : ''}`;
      case 'lure': return `${who}: 소음 유인 (${a.lureMode === 'device' ? '소음기' : '직접 뛰기'})`;
      default: return `${who}: ${ACTIONS[a.action].name}`;
    }
  }

  /* ---------- 피해 처리 (빈사 전환 + 전멸 방지) ---------- */
  // protectLast: 무작위 습격처럼 플레이어가 고르지 않은 피해로 마지막 활동 인원이 쓰러지지 않게 한다
  function damage(s, id, amt, phase, protectLast) {
    const p = sv(s, id);
    if (p.status !== 'ok' || amt <= 0) return 0;
    const before = p.hp;
    p.hp = Math.max(0, p.hp - Math.round(amt));
    s.injuredToday = true;
    if (p.hp === 0) {
      const others = s.survivors.filter((x) => x.status === 'ok' && x.id !== id);
      if (others.length === 0 && protectLast) {
        p.hp = 1;
        addLog(s, phase, `${josa(nm(id), '은/는')} 쓰러질 뻔했지만 마지막 의지로 버텼다. (체력 1)`, 'warn');
      } else {
        p.status = 'dying'; p.dyingDays = 0;
        s.morale -= 5;
        addLog(s, phase, `⚠ ${josa(nm(id), '이/가')} 빈사 상태에 빠졌다! 3일 안에 치료하지 않으면 위험하다.`, 'bad');
      }
    }
    return before - p.hp;
  }

  /* ---------- 정민 돌발 행동 ---------- */
  function jeongminQuirk(s, sid, phase) {
    if (sid !== 'jeongmin' || rand() >= 0.1) return 0;
    if (rand() < 0.5) {
      addLog(s, phase, '정민: “여기서 어그로 핑 찍어야 돼!” …라며 소리를 질렀다. 소음 +6 (저녁에 ‘숨죽이기’로 줄일 수 있다)', 'warn');
      return 6;
    }
    s.threat -= 6;
    addLog(s, phase, '정민이 게임에서 본 대로 깡통을 반대편으로 던졌다. 의외로 좀비들이 따라갔다. 위협도 −6', 'good');
    return 0;
  }

  /* ---------- 행동 처리 ---------- */
  const P = '낮';
  function doExplore(s, a) {
    const who = nm(a.sid), L = LOCATIONS[a.loc];
    const danger = exploreDanger(s, a.sid, a.loc, a.mode);
    const hadNote = !!s.locationNotes[a.loc];
    s.stats.explores++;
    let noise = MODES[a.mode].noise;
    if (a.sid === 'yongchan' && rand() < 0.2) {
      noise += 5;
      addLog(s, P, '용찬이 급하게 과자 봉지를 뜯는 소리가 복도에 울렸다. 소음 +5', 'warn');
    }

    { id: 'door_rattle', tone: 'bad', when: () => true, weight: (s) => (s.threat >= 40 ? 1.5 : 0.5),
      run: (s) => { s.threat += 6; s.defense -= 4; return '후문 셔터가 밤새 덜컹거렸다. 좀비들이 냄새를 맡은 것 같다. 위협도 +6, 방어 −4'; } },
  ];
  function rollEvent(s) {
    const pool = EVENTS.filter((e) => e.when(s)).map((e) => {
      let w = e.weight(s);
      if (s.crisisFlag && e.tone === 'good') w *= 2;          // 위기 뒤 반전 기회
      return { e, w };
    });
    const total = pool.reduce((a, b) => a + b.w, 0);
    let r = rand() * total;
    for (const { e, w } of pool) { r -= w; if (r <= 0) return e; }
    return pool[pool.length - 1].e;
  }

  /* ---------- 2·3단계: 낮 행동 실행 → 결과 ---------- */
  function snapshot(s) {
    return { food: s.food, materials: s.materials, medicine: s.medicine, morale: s.morale, threat: s.threat,
      defense: s.defense, hp: s.survivors.reduce((a, p) => a + p.hp, 0), alive: aliveCount(s), signals: s.rescueSignals };
  }
  function deltas(a, b) {
    const keys = [['food', '식량'], ['materials', '재료'], ['medicine', '의약품'], ['morale', '사기'], ['threat', '위협도'],
      ['defense', '방어'], ['hp', '총 체력'], ['alive', '생존자'], ['signals', '구조 신호']];
    return keys.filter(([k]) => b[k] !== a[k]).map(([k, label]) => ({ key: k, label, v: b[k] - a[k] }));
  }
  function runDay(s) {
    if (s.ended) return { ok: false, error: '게임이 끝났습니다.' };
    if (s.phase !== 'morning') return { ok: false, error: '이미 낮 행동을 마쳤습니다.' };
    const before = snapshot(s);
    s.noiseToday = 0; s.prep = 0; s.defenders = []; s.injuredToday = false;
    if (s.assignments.length === 0) addLog(s, P, '오늘은 아무도 밖에 나가지 않았다.', 'neutral');
    const busy = new Set();
    for (const a of s.assignments) {
      if (sv(s, a.sid).status !== 'ok') continue;
      busy.add(a.sid);
      HANDLERS[a.action](s, a);
      normalize(s);
    }
    // 대기 인원은 조금 쉰다
    for (const a of s.assignments) if (a.action === 'treat') busy.add(a.target);
    if (s.hungerDays === 0) for (const p of ableList(s)) if (!busy.has(p.id)) p.hp = Math.min(p.maxHp, p.hp + 5);
    // 오늘의 이벤트
    if (rand() < 0.6) {
      const e = rollEvent(s);
      addLog(s, '사건', e.run(s), e.tone === 'good' ? 'good' : e.tone === 'bad' ? 'bad' : 'neutral');
      normalize(s);
    }
    if (s.noiseToday > 0) addLog(s, P, `오늘 발생한 소음 합계 ${s.noiseToday}. 밤에 좀비들이 소리 난 곳을 조사하러 올 수 있다.`, s.noiseToday >= 10 ? 'warn' : 'neutral');
    s.assignments = [];
    s.night = { uv: false, hush: false, ration: false };
    s.phase = 'evening';
    s.summary = { title: `${s.day}일차 낮 행동 결과`, deltas: deltas(before, snapshot(s)) };
    return { ok: true };
  }
  function setNightOption(s, key, val) {
    if (s.ended || s.phase !== 'evening') return { ok: false, error: '저녁 단계에서만 바꿀 수 있습니다.' };
    if (key === 'uv' && val && s.uvBattery <= 0) return { ok: false, error: 'UV 배터리가 없습니다. 과학실 재료로 UV 랜턴을 만드세요.' };
    if (!(key in s.night)) return { ok: false, error: '알 수 없는 옵션' };
    s.night[key] = !!val;
    return { ok: true };
  }

  /* ---------- 4단계: 밤 (좀비 행동) ---------- */
  function nightPhase(s) {
    const N = '밤';
    const noise = nightNoise(s);
    const prevThreat = s.threat;
    s.threat = projectedThreat(s);
    if (s.night.hush) { s.morale -= 3; addLog(s, N, '모두 불을 끄고 숨을 죽였다. 소음 영향 절반, 사기 −3', 'neutral'); }
    if (s.weather === 'rain' && s.noiseToday > 0) addLog(s, N, '빗소리가 낮의 소음을 일부 덮어주었다.', 'good');
    if (s.injuredToday) addLog(s, N, '다친 사람의 피 냄새를 맡고 좀비가 더 모여들었다. 위협도 +4', 'warn');
    const diff = s.threat - prevThreat;
    addLog(s, N, `소음 ${Math.round(noise)}에 반응해 좀비들이 움직였다. 위협도 ${prevThreat} → ${s.threat} (${diff >= 0 ? '+' : ''}${diff})`, diff >= 8 ? 'warn' : 'neutral');
    const uv = uvActive(s);
    const chance = raidChance(s, s.threat);
    if (uv) {
      s.uvBattery -= 1; s.threat -= 5;
      addLog(s, N, `UV 랜턴을 창가에 켰다. 빛을 싫어하는 좀비들이 물러났다. 위협도 −5 (배터리 남음 ${s.uvBattery})`, 'good');
    }
    if (rand() * 100 < chance) {
      s.stats.raids++;
      s.crisisFlag = true;
      let hits = 1 + (s.threat >= 50 ? 1 : 0) + (s.threat >= 75 ? 1 : 0);
      addLog(s, N, `☣ 좀비 습격! (습격 확률 ${chance}%) 바리케이드가 흔들린다.`, 'bad');
      if (s.threat >= 60 && rand() < 0.5) { hits += 1; addLog(s, N, '몇몇 좀비가 생존자를 발견하고 질주해 왔다!', 'bad'); }
      const mitig = clamp((s.defense + s.prep) / 180, 0, 0.6);
      let total = 0;
      for (let i = 0; i < hits; i++) {
        const targets = ableList(s);
        if (!targets.length) break;
        let t = pick(targets).id;
        let dmg = randInt(12, 26) * (1 - mitig) * (uv ? 0.6 : 1);
        if (t !== 'dongkeun' && able(s, 'dongkeun')) {
          const ch = 0.25 + s.dongkeunTrust / 200 + (s.defenders.includes('dongkeun') ? 0.3 : 0);
          if (rand() < ch) {
            addLog(s, N, `동근이 ${josa(nm(t), '을/를')} 밀쳐내고 대신 맞았다. 피해 절반. 신뢰도 +6`, 'good');
            t = 'dongkeun'; dmg *= 0.5; s.dongkeunTrust += 6;
          }
        }
        if (t === 'yongchan' && rand() < 0.4) { dmg *= 0.5; addLog(s, N, '용찬이 본능적으로 몸을 피했다.', 'neutral'); }
        const lost = damage(s, t, dmg, N, true);
        total += lost;
        if (lost > 0) addLog(s, N, `${josa(nm(t), '이/가')} 공격당했다. 체력 −${lost}`, 'bad');
      }
      let kill = 10;
      if (s.defenders.includes('minseong') && able(s, 'minseong')) { kill += 10; addLog(s, N, '민성이 태연하게 좀비들을 처리했다. “밤 근무는 원래 이래.” 위협도 추가 −10', 'good'); }
      if (s.defenders.includes('gayoon') && gayoonState(s) === '안정') { kill += 6; addLog(s, N, '가윤이 문을 밀어붙여 좀비 여럿을 계단 아래로 굴려버렸다.', 'good'); }
      s.threat -= kill; s.defense -= 5;
      if (total <= 20) {
        s.morale += 4; s.stats.repelled++;
        let txt = `습격을 막아냈다! 피해 ${total}. 위기 극복으로 사기 +4, 위협도 −${kill}`;
        if (able(s, 'hyerin')) { s.morale += 3; txt += ' 혜린: “우리 좀 멋있지 않았어?” 사기 +3'; }
        if (able(s, 'gayoon')) s.gayoonMental += 5;
        addLog(s, N, txt, 'good');
      } else {
        s.morale -= 7; s.gayoonMental -= 8;
        addLog(s, N, `큰 피해를 입었지만 날이 밝기 전 좀비들이 물러갔다. 사기 −7, 위협도 −${kill}`, 'bad');
      }
    } else {
      addLog(s, N, s.threat >= 45 ? `좀비들이 담장 밖을 배회했지만 들어오지는 않았다. (습격 확률 ${chance}%)` : `조용한 밤이었다. (습격 확률 ${chance}%)`, s.threat >= 45 ? 'warn' : 'good');
    }
    normalize(s);
  }

  /* ---------- 5단계: 하루 정산 ---------- */
  function settle(s) {
    const S = '정산';
    const alive = aliveList(s), n = alive.length;
    const ration = s.night.ration;
    const need = ration ? Math.ceil(n / 2) : n;
    const eaten = Math.min(s.food, need);
    s.food -= eaten;
    const short = need - eaten;
    addLog(s, S, `생존자 ${n}명이 식량 ${eaten}개를 소비했다.${ration ? ' (배급 절약: 절반만 먹음)' : ''}`, 'neutral');
    // 용찬 추가 소비 (기본 소비와 별개)
    if (able(s, 'yongchan') || sv(s, 'yongchan').status === 'dying') {
      if (!ration && s.food >= 1) { s.food -= 1; addLog(s, S, '용찬 특성: 용찬이 식량 1개를 추가로 먹었다. (기본 소비와 별도)', 'neutral'); }
      else if (able(s, 'yongchan')) { s.morale -= 2; addLog(s, S, '용찬: “배고파서 좀비가 치킨으로 보여…” 용찬의 불만으로 사기 −2', 'warn'); }
    }
    if (ration) {
      s.morale -= 4;
      for (const p of ableList(s)) p.hp = Math.max(1, p.hp - 3);
      addLog(s, S, '배급 절약으로 모두 허기진다. 사기 −4, 체력 −3', 'warn');
    }
    if (short > 0) {
      s.hungerDays += 1;
      s.morale -= 4 + short;
      addLog(s, S, `식량이 부족해 ${short}명분을 먹지 못했다. 사기 −${4 + short}`, 'bad');
      if (s.hungerDays >= 2) {
        const h = 12 + 6 * (s.hungerDays - 2);
        addLog(s, S, `굶주림이 ${s.hungerDays}일째 이어져 모두 체력 −${h}`, 'bad');
        for (const p of ableList(s)) damage(s, p.id, h, S);
      }
    } else s.hungerDays = 0;
    // 빈사 → 사망 판정
    for (const p of s.survivors) {
      if (p.status !== 'dying') continue;
      p.dyingDays += 1;
      if (p.dyingDays >= 3) {
        p.status = 'dead'; p.hp = 0; s.stats.deaths++;
        s.morale -= 15; s.gayoonMental -= 15;
        addLog(s, S, `✝ ${josa(nm(p.id), '이/가')} 끝내 눈을 뜨지 못했다. 사기 −15`, 'bad');
      } else addLog(s, S, `${josa(nm(p.id), '은/는')} 아직 빈사 상태다. 남은 시간 ${3 - p.dyingDays}일.`, 'warn');
    }
    // 개인 상태·자연 변화
    if (able(s, 'hyerin')) s.morale += 1;
    if (s.morale >= 60) s.gayoonMental += 4; else if (s.morale < 30) s.gayoonMental -= 6;
    s.defense -= 3; s.prep = 0; s.defenders = [];
    if (s.intel > 0) s.intel -= 1;
    if (s.food >= aliveCount(s) * 2 && s.morale >= 50) s.crisisFlag = false;   // 충분히 안정되면 반전 이벤트 가중치 해제
    if (s.food === 0 || s.morale < 25) s.crisisFlag = true;
    normalize(s);
  }

  function checkEnd(s) {
    if (ableList(s).length === 0) {
      s.ended = { type: 'gameover', title: aliveCount(s) === 0 ? '생존반 전원 사망' : '더 이상 버틸 수 없다',
        text: '학교는 조용해졌다. 다음 생존반은 더 잘 해낼 수 있을 것이다.' };
      s.phase = 'ended';
      return true;
    }
    for (const v of VICTORY_CONDITIONS) {
      if (v.check(s)) { s.ended = { type: 'victory', id: v.id, title: v.title, text: v.text }; s.phase = 'ended'; return true; }
    }
    return false;
  }
  function rollWeather() {
    let r = rand() * 100;
    for (const [k, w] of WEATHER_TABLE) { r -= w; if (r <= 0) return k; }
    return 'sunny';
  }
  function morningReport(s) {
    const W = WEATHER[s.weather];
    addLog(s, '아침', `${s.day}일차 아침. 식량 ${s.food}개, 사기 ${s.morale}, 위협도 ${s.threat}, 날씨 ${W.name}(햇빛 ${W.sun}).`, 'neutral');
    if (s.food < aliveCount(s)) addLog(s, '아침', `식량이 오늘 필요량(${aliveCount(s)}개)보다 적다. 급식실 탐색이나 배급 절약을 고려하자.`, 'warn');
  }
  function runNight(s) {
    if (s.ended) return { ok: false, error: '게임이 끝났습니다.' };
    if (s.phase !== 'evening') return { ok: false, error: '먼저 낮 행동을 실행하세요.' };
    const before = snapshot(s);
    nightPhase(s);
    settle(s);
    const dayDone = s.day;
    s.day += 1;
    if (!checkEnd(s)) {
      s.weather = rollWeather();
      s.phase = 'morning';
      s.injuredToday = false; s.noiseToday = 0;
      s.night = { uv: false, hush: false, ration: false };
      morningReport(s);
    } else {
      addLog(s, '정산', s.ended.type === 'victory' ? `🏁 ${s.ended.title}` : `☠ ${s.ended.title}`, s.ended.type === 'victory' ? 'good' : 'bad');
    }
    s.summary = { title: `${dayDone}일차 밤·정산 보고`, deltas: deltas(before, snapshot(s)) };
    return { ok: true };
  }

  /* ---------- 위기 대응 조언 (평오·정민·혜린) ---------- */
  function advice(s) {
    const out = [];
    const n = aliveCount(s);
    const dying = s.survivors.filter((p) => p.status === 'dying');
    if (dying.length) out.push({ who: '정민', text: `회복 아이템 타이밍! ${dying.map((p) => `${nm(p.id)}(${3 - p.dyingDays}일 남음)`).join(', ')}부터 치료하자. 의약품이 없어도 응급처치는 된다.` });
    if (s.food < n) out.push({ who: '용찬', text: `밥이 모자라! 급식실 탐색(내가 가면 +2), 저녁에 배급 절약, 아니면 ‘서둘러’로 크게 털자.` });
    else if (s.food < n * 2) out.push({ who: '평오', text: `식량이 이틀 치도 안 남았어. 오늘 급식실을 한 번은 가는 게 좋겠어.` });
    if (s.threat >= 60) out.push({ who: '정민', text: `몹이 너무 많아. 소음 유인으로 빼고, 방어 준비나 UV 랜턴으로 버티자.${s.noisemakers ? '' : ' 소음기는 재료 1개면 만들 수 있어.'}` });
    if (s.morale < 35) out.push({ who: '혜린', text: '다들 표정이 너무 어두워. 휴식이나 대화로 숨 좀 돌리자. 위기 땐 나 행동 하나 더 할 수 있어!' });
    if (able(s, 'gayoon') && gayoonState(s) !== '안정') out.push({ who: '평오', text: `가윤이 아직 ${gayoonState(s)} 상태야. 누가 말을 걸어주면(대화) 힘을 낼 거야.` });
    if (s.defense < 15) out.push({ who: '평오', text: '방어선이 얇아. 쉘터 정비나 바리케이드 제작을 추천해.' });
    if (!out.length) out.push({ who: '정민', text: `지금은 안정적이야. ${s.weather === 'sunny' ? '햇빛 강한 날엔 옥상에서 구조 신호 보내기 좋아.' : '재료를 모아 UV 랜턴을 준비해두자.'}` });
    return out.slice(0, 3);
  }

  return {
    CHARACTERS, CHAR, LOCATIONS, MODES, WEATHER, ACTIONS, RECIPES, EVENTS, VICTORY_CONDITIONS, LOOT_NAME,
    newGame, assign, unassign, validate, describeAssignment, runDay, runNight, setNightOption,
    sv, able, aliveCount, ableList, isCrisis, maxAP, gayoonState, trustLabel, efficiency, available,
    exploreDanger, lureDanger, riskReport, riskLabel, lootRange, projectedThreat, raidChance, defendValue, fortifyValue,
    advice, josa, nm, normalize,
  };
})();
</script>

<!-- =====================================================================
     4) 화면 렌더링 + 입력 처리 + 저장/불러오기
     ===================================================================== -->
<script>
'use strict';
(function () {
  const G = Game;
  const SAVE_KEY = 'banggwahu-survival-v1';
  const app = document.getElementById('app');
  let S = null;                       // 게임 상태
  const ui = { screen: 'menu', sel: null, action: null, loc: 'cafeteria', mode: 'normal', target: null,
    recipe: 'barricade', useMaterial: false, lureMode: 'manual', modal: null, toast: null, logAll: false };
  let toastTimer = null;

  /* ---------- 저장 ---------- */
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 저장 실패해도 게임은 계속 */ } }
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.version !== 1 || !Array.isArray(s.survivors)) return null;
      return s;
    } catch (e) { return null; }
  }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  /* ---------- 도우미 ---------- */
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function toast(msg, err) {
    ui.toast = { msg, err };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { ui.toast = null; renderToast(); }, 2400);
    renderToast();
  }
  function renderToast() {
    let el = document.getElementById('toast');
    if (!ui.toast) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.className = 'toast' + (ui.toast.err ? ' err' : '');
    el.textContent = ui.toast.msg;
  }
  const okExpr = (x) => (['default', 'smile', 'surprised', 'tired'].includes(x) ? x : 'default');
  const pf = (id, expr, size, extra) => `<span class="pf ${size || ''} pf-${id}-${okExpr(expr)} ${extra || ''}" style="--c:${G.CHAR[id].color}" role="img" aria-label="${G.nm(id)}"></span>`;
  const fb = (id, expr) => `<span class="fb fb-${id}-${okExpr(expr)}" role="img" aria-label="${G.nm(id)} 전신"></span>`;
  const particle = (name, pair) => G.josa(name, pair).slice(name.length);
  const riskClass = (d) => (d < 25 ? 'risk-low' : d < 50 ? 'risk-mid' : 'risk-high');
  const riskColor = (d) => (d < 25 ? 'var(--good)' : d < 50 ? 'var(--accent)' : 'var(--danger)');

  const ACT_ICON = { explore: '🎒', rest: '😴', treat: '🩹', fortify: '🔨', craft: '🧪', defend: '🛡️', talk: '💬', lure: '📢' };
  const LOC_ICON = { rooftop: '📡', library: '📚', science: '🧪', nurse: '💊', cafeteria: '🍱' };

  /* ---------- 생존반 소개 · 튜토리얼 ---------- */
  const TUT_KEY = 'banggwahu-tutorial-v1';
  const tutDone = () => { try { return localStorage.getItem(TUT_KEY) === '1'; } catch (e) { return false; } };
  const setTutDone = () => { try { localStorage.setItem(TUT_KEY, '1'); } catch (e) {} };
  /* 성격은 기획서 설정 그대로, 팁은 실제 규칙 기준 */
  const INTRO = {

  function renderIntro() {
    if (!ui.intro) return '';
    if (ui.intro.type === 'chars') {
      const i = ui.intro.idx, c = G.CHARACTERS[i], info = INTRO[c.id];
      ui.intro.seen = ui.intro.seen || {}; ui.intro.seen[i] = true;
      const last = i === G.CHARACTERS.length - 1;
      const nextLabel = last ? (ui.intro.from === 'first' ? '튜토리얼 시작 ›' : '닫기') : '다음 ›';
      return `<div class="overlay" style="z-index:35"><div class="modal intro-modal" role="dialog" aria-label="생존반 소개" style="--c:${c.color}">
        <div class="intro-top"><h2>생존반 소개 <span class="muted small" style="font-family:var(--body)">${i + 1} / ${G.CHARACTERS.length}</span></h2>
          <button class="linkbtn" data-a="intro-skip">${ui.intro.from === 'first' ? '소개 건너뛰기' : '닫기'}</button></div>
        <div class="intro-tabs" role="tablist">${G.CHARACTERS.map((x, k) => `<button role="tab" aria-selected="${k === i}" class="${k === i ? 'on' : ''} ${ui.intro.seen[k] ? 'seen' : ''}" data-a="intro-go" data-v="${k}" title="${x.name}">${pf(x.id, k === i ? 'smile' : 'default')}</button>`).join('')}</div>
        <div class="intro-body">
          <div class="intro-art">${fb(c.id)}</div>
          <div class="intro-info">
            <div class="nm" style="color:${c.color}">${c.name}</div>
            <div class="role">${c.role} · 고유 특성 <b style="color:var(--text)">${c.trait}</b></div>
            <h4>성격</h4><ul>${info.traits.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
            <h4>고유 능력</h4><p>${esc(c.traitDesc)}</p>
            <div class="tipbox">💡 ${esc(info.tip)}</div>
            <div class="intro-hp">❤️ 최대 체력 ${c.maxHp}<span class="hpbar"><i style="width:${Math.round(c.maxHp / 130 * 100)}%"></i></span></div>
          </div>
        </div>
        <div class="intro-nav"><button class="btn" data-a="intro-prev" ${i === 0 ? 'disabled' : ''}>‹ 이전</button>
          <button class="btn primary" data-a="intro-next">${nextLabel}</button></div>
      </div></div>`;
    }
    const k = ui.intro.step, st = TOUR[k];
    return `<div class="tour-block"></div><div class="tour-hole" id="tour-hole"></div>
      <div class="tour-card" id="tour-card" role="dialog" aria-label="튜토리얼">
        <div class="tour-dots">${TOUR.map((_, j) => `<i class="${j === k ? 'on' : ''}"></i>`).join('')}</div>
        <h3>${st.title}</h3><p>${st.text}</p>
        <div class="nav"><button class="linkbtn" data-a="tour-skip">${k === TOUR.length - 1 ? '' : '튜토리얼 건너뛰기'}</button>
          <span style="display:flex;gap:6px">${k > 0 ? '<button class="btn" data-a="tour-prev">이전</button>' : ''}
          <button class="btn primary" data-a="tour-next">${k === TOUR.length - 1 ? '시작하기' : '다음'}</button></span></div>
      </div>`;
  }
  function positionTour() {
    if (!ui.intro || ui.intro.type !== 'tour') return;
    const st = TOUR[ui.intro.step];
    const hole = document.getElementById('tour-hole'), card = document.getElementById('tour-card');
    if (!hole || !card) return;
    const el = st.sel && document.querySelector(st.sel);
    const vw = window.innerWidth, vh = window.innerHeight;
    if (!el) {   // 비출 곳이 없으면 가운데 카드만
      hole.style.cssText = `top:${vh / 2}px;left:${vw / 2}px;width:0;height:0;outline:none`;
      card.style.left = Math.max(12, (vw - card.offsetWidth) / 2) + 'px';
      card.style.top = Math.max(12, (vh - card.offsetHeight) / 2) + 'px';
      return;
    }
    el.scrollIntoView({ block: 'nearest' });
    const r = el.getBoundingClientRect(), pad = 6;
    hole.style.cssText = `top:${r.top - pad}px;left:${r.left - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px`;
    const cw = card.offsetWidth, ch = card.offsetHeight, gap = 14;
    let top, left;
    if (r.bottom + gap + ch < vh) top = r.bottom + gap;                         // 아래
    else if (r.top - gap - ch > 0) top = r.top - gap - ch;                     // 위
    else if (r.right + gap + cw < vw) { left = r.right + gap; top = r.top + 10; } // 오른쪽
    else if (r.left - gap - cw > 0) { left = r.left - gap - cw; top = r.top + 10; } // 왼쪽
    else top = Math.max(12, (vh - ch) / 2);                                   // 겹치더라도 가운데
    if (left == null) left = r.left + r.width / 2 - cw / 2;
    card.style.left = Math.min(Math.max(12, left), vw - cw - 12) + 'px';
    card.style.top = Math.min(Math.max(12, top), vh - ch - 12) + 'px';
  }
  function finishIntro() {
    const first = ui.intro && ui.intro.from === 'first';
    ui.intro = null;
    setTutDone();
    // 첫 시작이라면 첫 행동(혜린 → 가윤과 대화)을 미리 골라 둔다
    if (first && S && S.phase === 'morning' && G.able(S, 'hyerin') && G.able(S, 'gayoon') && !S.assignments.some((a) => a.sid === 'hyerin')) {
      ui.sel = 'hyerin'; ui.action = 'talk'; ui.target = 'gayoon';
      toast('혜린이 가윤에게 말을 걸게 골라 뒀어요. ‘배정하기’를 눌러 보세요!');
    }
  }
  const LOC_GIVES = { rooftop: '구조 신호', library: '정보', science: '재료', nurse: '의약품', cafeteria: '식량' };

  function cardExpr(p) {
    if (p.status === 'dead') return 'default';
    if (p.status === 'dying' || p.hp < p.maxHp * 0.4) return 'tired';
    if (p.id === 'gayoon') { const g = G.gayoonState(S); if (g === '충격') return 'tired'; if (g === '불안') return 'default'; }
    if (p.id === 'pyeongoh' && S.threat >= 70) return 'surprised';
    if (S.hungerDays > 0 || S.morale < 30) return 'tired';
    if (S.morale >= 70) return 'smile';
    return 'default';
  }
  function findChar(text) {
    let best = null, at = Infinity;
    for (const c of G.CHARACTERS) { const i = text.indexOf(c.name); if (i >= 0 && i < at) { at = i; best = c.id; } }
    return best;
  }
  function logExpr(e) {
    if (/빈사|눈을 뜨지|굶주림|허기|배고파/.test(e.text)) return 'tired';
    return { good: 'smile', bad: 'surprised' }[e.tone] || 'default';
  }
  function makeSpotlight(start) {
    const list = S.log.slice(start).map((e) => ({ e, id: findChar(e.text) })).filter((x) => x.id);
    const last = (f) => { for (let i = list.length - 1; i >= 0; i--) if (f(list[i])) return list[i]; return null; };
    const pick = last((x) => x.e.phase === '사건') || last((x) => x.e.tone === 'bad') || last((x) => x.e.tone === 'good') || list[list.length - 1];
    S.spotlight = pick ? { id: pick.id, expr: logExpr(pick.e), text: pick.e.text, phase: pick.e.phase } : null;
  }
  function currentPlan() {
    return { sid: ui.sel, action: ui.action, loc: ui.loc, mode: ui.mode, target: ui.target, recipe: ui.recipe, useMaterial: ui.useMaterial, lureMode: ui.lureMode };
  }
  /* 행동을 지금 고를 수 없는 이유 (없으면 null) */
  function actionBlock(sid, act) {
    const others = S.survivors.filter((x) => x.id !== sid && x.status !== 'dead');
    if (act === 'treat' && !others.some((x) => x.status === 'dying' || x.hp < x.maxHp)) return '다친 사람이 없음';
    if (act === 'craft' && G.available(S, 'materials') < 1) return '재료 없음';
    if (act === 'talk' && !others.some((x) => x.status === 'ok')) return '대화 상대 없음';
    return null;
  }
